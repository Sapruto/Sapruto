<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .node {
      animation: pulse 3s ease-in-out infinite;
    }
    .node-text {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
      fill: #ffffff;
      filter: drop-shadow(0 0 10px rgba(0,255,0,0.3));
    }
    .link {
      stroke: #00ff00;
      stroke-width: 1.5;
      opacity: 0.4;
      animation: pulse 4s ease-in-out infinite;
    }
    .link-secondary {
      stroke: #ff00ff;
      stroke-width: 1;
      opacity: 0.2;
      animation: pulse 5s ease-in-out infinite;
    }
    .label {
      fill: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      opacity: 0.6;
    }
  </style>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#0a0a0a" />
  <text x="400" y="30" fill="#00ff00" font-family="monospace" font-size="20" text-anchor="middle" filter="url(#glow)">
    ⚡ My Technologies & Their Connections
  </text>
  <g filter="url(#glow)">
    <circle cx="400" cy="300" r="45" fill="#ff6b6b" class="node" />
    <text x="400" y="300" class="node-text" font-size="16">Sapruto</text>
    <circle cx="200" cy="150" r="35" fill="#4ecdc4" class="node" />
    <text x="200" y="150" class="node-text">C++</text>
    <circle cx="600" cy="150" r="35" fill="#ffe66d" class="node" />
    <text x="600" y="150" class="node-text">Python</text>
    <circle cx="150" cy="400" r="35" fill="#a8e6cf" class="node" />
    <text x="150" y="400" class="node-text">Unity</text>
    <circle cx="650" cy="400" r="35" fill="#ff8a5c" class="node" />
    <text x="650" y="400" class="node-text">React</text>
    <circle cx="300" cy="100" r="30" fill="#6c5ce7" class="node" />
    <text x="300" y="100" class="node-text">OpenGL</text>
    <circle cx="500" cy="100" r="30" fill="#fd79a8" class="node" />
    <text x="500" y="100" class="node-text">FastAPI</text>
    <circle cx="300" cy="500" r="30" fill="#00b894" class="node" />
    <text x="300" y="500" class="node-text">Docker</text>
    <circle cx="500" cy="500" r="30" fill="#e17055" class="node" />
    <text x="500" y="500" class="node-text">SQL</text>
    <circle cx="100" cy="250" r="28" fill="#00cec9" class="node" />
    <text x="100" y="250" class="node-text">Arduino</text>
    <circle cx="700" cy="250" r="28" fill="#fdcb6e" class="node" />
    <text x="700" y="250" class="node-text">ROS</text>
    <circle cx="450" cy="200" r="26" fill="#81ecec" class="node" />
    <text x="450" y="200" class="node-text">Git</text>
    <circle cx="350" cy="200" r="26" fill="#dfe6e9" class="node" />
    <text x="350" y="200" class="node-text">Linux</text>
  </g>
  <g class="link">
    <line x1="400" y1="300" x2="200" y2="150" />
    <line x1="400" y1="300" x2="600" y2="150" />
    <line x1="400" y1="300" x2="150" y2="400" />
    <line x1="400" y1="300" x2="650" y2="400" />
    <line x1="400" y1="300" x2="300" y2="100" />
    <line x1="400" y1="300" x2="500" y2="100" />
    <line x1="400" y1="300" x2="300" y2="500" />
    <line x1="400" y1="300" x2="500" y2="500" />
    <line x1="400" y1="300" x2="100" y2="250" />
    <line x1="400" y1="300" x2="700" y2="250" />
    <line x1="400" y1="300" x2="450" y2="200" />
    <line x1="400" y1="300" x2="350" y2="200" />
  </g>
  <g class="link-secondary">
    <line x1="200" y1="150" x2="300" y2="100" />
    <line x1="600" y1="150" x2="500" y2="100" />
    <line x1="200" y1="150" x2="100" y2="250" />
    <line x1="600" y1="150" x2="700" y2="250" />
    <line x1="150" y1="400" x2="100" y2="250" />
    <line x1="650" y1="400" x2="700" y2="250" />
    <line x1="300" y1="500" x2="150" y2="400" />
    <line x1="500" y1="500" x2="650" y2="400" />
    <line x1="300" y1="100" x2="350" y2="200" />
    <line x1="500" y1="100" x2="450" y2="200" />
    <line x1="350" y1="200" x2="450" y2="200" />
  </g>
  <g class="label">
    <rect x="20" y="550" width="12" height="12" fill="#00ff00" rx="2" />
    <text x="40" y="562">Main connections</text>
    <rect x="200" y="550" width="12" height="12" fill="#ff00ff" rx="2" />
    <text x="220" y="562">Cross-connections</text>
    <rect x="380" y="550" width="12" height="12" fill="#ff6b6b" rx="6" />
    <text x="400" y="562">Center node</text>
    <rect x="540" y="550" width="12" height="12" fill="#4ecdc4" rx="6" />
    <text x="560" y="562">Technologies</text>
  </g>
</svg>
