name: Generate Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Generate Snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 4D Cube
        run: |
          mkdir -p dist
          cat > dist/4d-cube.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
            <style>
              @keyframes spin {
                0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
                100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
              }
              @keyframes pulse {
                0%, 100% { opacity: 0.3; }
                50% { opacity: 1; }
              }
              .cube-container {
                animation: spin 20s linear infinite;
                transform-style: preserve-3d;
                transform-origin: center;
              }
              .vertex {
                animation: pulse 3s ease-in-out infinite;
              }
              .vertex:nth-child(1) { animation-delay: 0s; }
              .vertex:nth-child(2) { animation-delay: 0.3s; }
              .vertex:nth-child(3) { animation-delay: 0.6s; }
              .vertex:nth-child(4) { animation-delay: 0.9s; }
              .vertex:nth-child(5) { animation-delay: 1.2s; }
              .vertex:nth-child(6) { animation-delay: 1.5s; }
              .vertex:nth-child(7) { animation-delay: 1.8s; }
              .vertex:nth-child(8) { animation-delay: 2.1s; }
              .vertex:nth-child(9) { animation-delay: 2.4s; }
              .vertex:nth-child(10) { animation-delay: 2.7s; }
              .vertex:nth-child(11) { animation-delay: 3.0s; }
              .vertex:nth-child(12) { animation-delay: 3.3s; }
              .vertex:nth-child(13) { animation-delay: 3.6s; }
              .vertex:nth-child(14) { animation-delay: 3.9s; }
              .vertex:nth-child(15) { animation-delay: 4.2s; }
              .vertex:nth-child(16) { animation-delay: 4.5s; }
              text {
                fill: #00ff00;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                text-anchor: middle;
                dominant-baseline: central;
                filter: drop-shadow(0 0 5px #00ff00);
              }
              .line {
                stroke: #00ff00;
                stroke-width: 1;
                opacity: 0.3;
                animation: pulse 4s ease-in-out infinite;
              }
            </style>
            
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            
            <rect width="800" height="600" fill="#0a0a0a" />
            
            <g transform="translate(400, 300) scale(1.2)">
              <g class="cube-container">
                <!-- 16 vertices of 4D hypercube -->
                <g filter="url(#glow)">
                  <circle cx="-100" cy="-100" r="8" fill="#ff6b6b" class="vertex"/>
                  <text x="-100" y="-120" class="vertex">C++</text>
                  
                  <circle cx="100" cy="-100" r="8" fill="#4ecdc4" class="vertex"/>
                  <text x="100" y="-120" class="vertex">Python</text>
                  
                  <circle cx="-100" cy="100" r="8" fill="#ffe66d" class="vertex"/>
                  <text x="-100" y="120" class="vertex">C#</text>
                  
                  <circle cx="100" cy="100" r="8" fill="#a8e6cf" class="vertex"/>
                  <text x="100" y="120" class="vertex">React</text>
                  
                  <circle cx="-70" cy="-70" r="8" fill="#ff8a5c" class="vertex"/>
                  <text x="-70" y="-90" class="vertex">OpenGL</text>
                  
                  <circle cx="70" cy="-70" r="8" fill="#6c5ce7" class="vertex"/>
                  <text x="70" y="-90" class="vertex">FastAPI</text>
                  
                  <circle cx="-70" cy="70" r="8" fill="#fd79a8" class="vertex"/>
                  <text x="-70" y="90" class="vertex">Unity</text>
                  
                  <circle cx="70" cy="70" r="8" fill="#00b894" class="vertex"/>
                  <text x="70" y="90" class="vertex">Docker</text>
                  
                  <circle cx="-130" cy="-130" r="6" fill="#e17055" class="vertex"/>
                  <text x="-130" y="-150" class="vertex">Qt</text>
                  
                  <circle cx="130" cy="-130" r="6" fill="#00cec9" class="vertex"/>
                  <text x="130" y="-150" class="vertex">SQL</text>
                  
                  <circle cx="-130" cy="130" r="6" fill="#fdcb6e" class="vertex"/>
                  <text x="-130" y="150" class="vertex">Arduino</text>
                  
                  <circle cx="130" cy="130" r="6" fill="#81ecec" class="vertex"/>
                  <text x="130" y="150" class="vertex">ROS</text>
                  
                  <circle cx="-50" cy="-50" r="6" fill="#fab1a0" class="vertex"/>
                  <text x="-50" y="-65" class="vertex">Git</text>
                  
                  <circle cx="50" cy="-50" r="6" fill="#dfe6e9" class="vertex"/>
                  <text x="50" y="-65" class="vertex">Linux</text>
                  
                  <circle cx="-50" cy="50" r="6" fill="#b2bec3" class="vertex"/>
                  <text x="-50" y="65" class="vertex">K8s</text>
                  
                  <circle cx="50" cy="50" r="6" fill="#636e72" class="vertex"/>
                  <text x="50" y="65" class="vertex">Rust</text>
                </g>
                
                <!-- Lines between vertices -->
                <g class="line">
                  <line x1="-100" y1="-100" x2="100" y2="-100" />
                  <line x1="-100" y1="-100" x2="-100" y2="100" />
                  <line x1="100" y1="-100" x2="100" y2="100" />
                  <line x1="-100" y1="100" x2="100" y2="100" />
                  
                  <line x1="-70" y1="-70" x2="70" y2="-70" />
                  <line x1="-70" y1="-70" x2="-70" y2="70" />
                  <line x1="70" y1="-70" x2="70" y2="70" />
                  <line x1="-70" y1="70" x2="70" y2="70" />
                  
                  <line x1="-100" y1="-100" x2="-70" y2="-70" />
                  <line x1="100" y1="-100" x2="70" y2="-70" />
                  <line x1="-100" y1="100" x2="-70" y2="70" />
                  <line x1="100" y1="100" x2="70" y2="70" />
                  
                  <line x1="-130" y1="-130" x2="130" y2="-130" />
                  <line x1="-130" y1="-130" x2="-130" y2="130" />
                  <line x1="130" y1="-130" x2="130" y2="130" />
                  <line x1="-130" y1="130" x2="130" y2="130" />
                  
                  <line x1="-130" y1="-130" x2="-100" y2="-100" />
                  <line x1="130" y1="-130" x2="100" y2="-100" />
                  <line x1="-130" y1="130" x2="-100" y2="100" />
                  <line x1="130" y1="130" x2="100" y2="100" />
                  
                  <line x1="-100" y1="-100" x2="100" y2="100" />
                  <line x1="100" y1="-100" x2="-100" y2="100" />
                  <line x1="-130" y1="-130" x2="130" y2="130" />
                  <line x1="130" y1="-130" x2="-130" y2="130" />
                </g>
              </g>
            </g>
            
            <text x="400" y="570" fill="#00ff00" font-family="monospace" font-size="14" text-anchor="middle" opacity="0.7">
              4D Why not?
            </text>
          </svg>
          EOF

      - name: Generate Tech Graph
        run: |
          cat > dist/tech-graph.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
            <style>
              @keyframes pulse {
                0%, 100% { opacity: 0.3; }
                50% { opacity: 1; }
              }
              .node {
                animation: pulse 3s ease-in-out infinite;
              }
              .node-text {
                font-family: 'Courier New', monospace;
                font-size: 13px;
                font-weight: bold;
                text-anchor: middle;
                dominant-baseline: central;
                fill: #ffffff;
                filter: drop-shadow(0 0 10px rgba(0,255,0,0.3));
              }
              .link {
                stroke: #00ff00;
                stroke-width: 1.5;
                opacity: 0.4;
                animation: pulse 4s ease-in-out infinite;
              }
              .link-secondary {
                stroke: #ff00ff;
                stroke-width: 1;
                opacity: 0.2;
                animation: pulse 5s ease-in-out infinite;
              }
              .label {
                fill: #00ff00;
                font-family: 'Courier New', monospace;
                font-size: 11px;
                opacity: 0.6;
              }
            </style>
            
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            
            <rect width="800" height="600" fill="#0a0a0a" />
            
            <text x="400" y="30" fill="#00ff00" font-family="monospace" font-size="20" text-anchor="middle" filter="url(#glow)">
              ⚡ My Technologies & Their Connections
            </text>
            
            <g filter="url(#glow)">
              <circle cx="400" cy="300" r="45" fill="#ff6b6b" class="node" />
              <text x="400" y="300" class="node-text" font-size="16">Sapruto</text>
              
              <circle cx="200" cy="150" r="35" fill="#4ecdc4" class="node" />
              <text x="200" y="150" class="node-text">C++</text>
              
              <circle cx="600" cy="150" r="35" fill="#ffe66d" class="node" />
              <text x="600" y="150" class="node-text">Python</text>
              
              <circle cx="150" cy="400" r="35" fill="#a8e6cf" class="node" />
              <text x="150" y="400" class="node-text">Unity</text>
              
              <circle cx="650" cy="400" r="35" fill="#ff8a5c" class="node" />
              <text x="650" y="400" class="node-text">React</text>
              
              <circle cx="300" cy="100" r="30" fill="#6c5ce7" class="node" />
              <text x="300" y="100" class="node-text">OpenGL</text>
              
              <circle cx="500" cy="100" r="30" fill="#fd79a8" class="node" />
              <text x="500" y="100" class="node-text">FastAPI</text>
              
              <circle cx="300" cy="500" r="30" fill="#00b894" class="node" />
              <text x="300" y="500" class="node-text">Docker</text>
              
              <circle cx="500" cy="500" r="30" fill="#e17055" class="node" />
              <text x="500" y="500" class="node-text">SQL</text>
              
              <circle cx="100" cy="250" r="28" fill="#00cec9" class="node" />
              <text x="100" y="250" class="node-text">Arduino</text>
              
              <circle cx="700" cy="250" r="28" fill="#fdcb6e" class="node" />
              <text x="700" y="250" class="node-text">ROS</text>
              
              <circle cx="450" cy="200" r="26" fill="#81ecec" class="node" />
              <text x="450" y="200" class="node-text">Git</text>
              
              <circle cx="350" cy="200" r="26" fill="#dfe6e9" class="node" />
              <text x="350" y="200" class="node-text">Linux</text>
            </g>
            
            <g class="link">
              <line x1="400" y1="300" x2="200" y2="150" />
              <line x1="400" y1="300" x2="600" y2="150" />
              <line x1="400" y1="300" x2="150" y2="400" />
              <line x1="400" y1="300" x2="650" y2="400" />
              <line x1="400" y1="300" x2="300" y2="100" />
              <line x1="400" y1="300" x2="500" y2="100" />
              <line x1="400" y1="300" x2="300" y2="500" />
              <line x1="400" y1="300" x2="500" y2="500" />
              <line x1="400" y1="300" x2="100" y2="250" />
              <line x1="400" y1="300" x2="700" y2="250" />
              <line x1="400" y1="300" x2="450" y2="200" />
              <line x1="400" y1="300" x2="350" y2="200" />
            </g>
            
            <g class="link-secondary">
              <line x1="200" y1="150" x2="300" y2="100" />
              <line x1="600" y1="150" x2="500" y2="100" />
              <line x1="200" y1="150" x2="100" y2="250" />
              <line x1="600" y1="150" x2="700" y2="250" />
              <line x1="150" y1="400" x2="100" y2="250" />
              <line x1="650" y1="400" x2="700" y2="250" />
              <line x1="300" y1="500" x2="150" y2="400" />
              <line x1="500" y1="500" x2="650" y2="400" />
              <line x1="300" y1="100" x2="350" y2="200" />
              <line x1="500" y1="100" x2="450" y2="200" />
              <line x1="350" y1="200" x2="450" y2="200" />
            </g>
            
            <g class="label">
              <rect x="20" y="550" width="12" height="12" fill="#00ff00" rx="2" />
              <text x="40" y="562">Main connections</text>
              
              <rect x="200" y="550" width="12" height="12" fill="#ff00ff" rx="2" />
              <text x="220" y="562">Cross-connections</text>
              
              <rect x="380" y="550" width="12" height="12" fill="#ff6b6b" rx="6" />
              <text x="400" y="562">Center node</text>
              
              <rect x="540" y="550" width="12" height="12" fill="#4ecdc4" rx="6" />
              <text x="560" y="562">Technologies</text>
            </g>
          </svg>
          EOF

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update animations [skip ci]"
